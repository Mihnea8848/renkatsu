name: Release

# A tag such as v0.1.1 builds the installers and attaches them to a draft
# release of that tag, which is published by hand after a look. Running the
# workflow by hand, or a pull request that changes the packaging, builds the
# same files as artifacts only, to try them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # a change to the packaging builds the installers once before it lands
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # the oldest supported runner, so the programs run on older systems too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Version
        id: version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rk-studio") | .version')" >>"$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --release --locked -p rk-studio -p rk-cli
      - name: AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist AppDir/usr/bin
          cp target/release/renkatsu target/release/rk AppDir/usr/bin/
          cp packaging/renkatsu.desktop packaging/renkatsu.png AppDir/
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fsSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "dist/Renkatsu-$VERSION-linux-x86_64.AppImage"
      - name: Archive with an install script
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="Renkatsu-$VERSION-linux-x86_64"
          mkdir -p "$name"
          cp target/release/renkatsu target/release/rk packaging/renkatsu.desktop packaging/renkatsu.png \
            packaging/linux/install.sh LICENSE README.md "$name/"
          cp -r LICENSES "$name/"
          tar -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Version
        id: version
        shell: bash
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rk-studio") | .version')" >>"$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --release --locked -p rk-studio -p rk-cli
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DVersion=${{ steps.version.outputs.version }}" packaging\windows\renkatsu.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable archive
        shell: pwsh
        run: |
          $name = "Renkatsu-${{ steps.version.outputs.version }}-windows-x64-portable"
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item target\release\renkatsu.exe, target\release\rk.exe, README.md $name
          Copy-Item LICENSE "$name\LICENSE.txt"
          Copy-Item -Recurse LICENSES $name
          Compress-Archive -Path $name -DestinationPath "dist\$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "Renkatsu ${GITHUB_REF_NAME#v}" \
            --notes "Release notes follow."
