[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmpv = { version = "1", features = ["with-serde"] }
rmp-serde = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
rayon = "1"
rk-core = { path = "crates/rk-core" }
rk-card = { path = "crates/rk-card" }
rk-unityfs = { path = "crates/rk-unityfs" }
rk-vfs = { path = "crates/rk-vfs" }
rk-chara = { path = "crates/rk-chara" }
rk-render = { path = "crates/rk-render" }
glam = "0.29"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
