[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.8"
edition = "2021"
license = "LicenseRef-PolyForm-Shield-1.0.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmpv = { version = "1", features = ["with-serde"] }
rmp-serde = "1"
toml = "1.2"
clap = { version = "4", features = ["derive"] }
rayon = "1"
indicatif = "0.18"
console = "0.16"
rk-core = { path = "crates/rk-core" }
rk-card = { path = "crates/rk-card" }
rk-unityfs = { path = "crates/rk-unityfs" }
rk-vfs = { path = "crates/rk-vfs" }
rk-packages = { path = "crates/rk-packages" }
rk-chara = { path = "crates/rk-chara" }
rk-render = { path = "crates/rk-render" }
rk-map = { path = "crates/rk-map" }
rk-asset = { path = "crates/rk-asset" }
glam = "0.29"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# texture2ddecoder's BC6H decoder shifts past the width of its integers on
# the game's reflection cubemaps, which only a debug build's overflow
# checks stop at: maps then fail to load in a dev build of the editor,
# whose GPU device is made without block compression.
[profile.dev.package.texture2ddecoder]
overflow-checks = false

# CI: no optimisation and no debug info, to compile as fast as possible.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = false

[profile.ci.package."*"]
opt-level = 0
