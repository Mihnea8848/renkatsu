[package]
name = "rk-installer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "renkatsu-installer"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "accesskit"] }
egui = "0.36"
rk-packages.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
