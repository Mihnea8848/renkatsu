[package]
name = "rk-packages"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
rk-core.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
# HTTPS with rustls and the system's own certificates: no OpenSSL, and no
# bundled certificate list.
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
