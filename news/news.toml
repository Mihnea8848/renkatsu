[[post]]
date = 2026-11-25
title = "A new Properties panel"
author = "Mihnea8848"
summary = "Properties are redone: framed groups, sliders, page icons and a search that finds any field. It comes with 0.3.0."
body = """
The Properties panel is redone, and it comes with 0.3.0. It had grown into long lists of rows that were hard to read and harder to use, so I tried three designs in the real program and kept the one that worked best.

Each section is now a framed group, values with a range are sliders with their number beside them, and levels step. The name of what is selected, its pages as icons, the search and the settings share one line at the top, and each page has its title. The search finds a field on any page, not only the one that is open. Rows that cannot do anything right now are hidden instead of greyed out, and the diamonds for keys have a column of their own.

Load card and the modules moved from the viewport's header into the Character section, where the rest of the character is. Panels can also be closed now, from their tab or from their own window once dragged out, and come back from the Window menu.
"""
pictures = [
    { file = "images/2026-11-25-properties.jpg", caption = "The new Properties panel, on the Animation page of a character", after = 1 },
]

[[post]]
date = 2026-11-25
title = "Faces come alive"
author = "Mihnea8848"
summary = "Hand patterns, expressions with presets, blinking, and eyes and heads that follow the camera or anything in the scene. It comes with 0.3.0."
body = """
Characters in 0.3.0 have their faces and hands. Each hand takes one of CharaStudio's hand patterns, over whatever the animation does with the fingers. The face takes the game's eyebrows, eyes and mouths, each shown as a picture of the character herself, with tears, blush, how open the eyes and mouth are, and the extras of KK_ExpressionControl. Presets set a whole expression at once.

The eyes blink as the game blinks them, each character on her own rhythm, and where she looks is set under Expression: ahead, at the camera, away from it, or at any object of the scene. Pick another character and she looks him in the face. Her head turns toward the camera too, by the game's own rules and limits.

All of it takes keys on the timeline, so a face can change during an animation.
"""
pictures = [
    { file = "images/2026-11-25-looking-at-the-camera.jpg", caption = "Eyes and head turned toward the camera, on a desk in the classroom", after = 0 },
    { file = "images/2026-11-25-expression-section.png", caption = "Expression, with the patterns as pictures and where she looks", after = 2 },
]

[[post]]
date = 2026-11-25
title = "Skirts on a new cloth solver"
author = "Mihnea8848"
summary = "Skirts move on a cloth solver that runs on the graphics card, and come to rest when the character stands still. It comes with 0.3.0."
body = """
Skirts in 0.3.0 move on a new cloth solver that runs on the graphics card. Each skirt gets a kind, tight, pleated, flowing or fixed, guessed from the outfit and changeable on the Renkatsu page, and moves the way that kind of skirt should.

Skirts now come to rest when the character stands still instead of shaking, rest on seats, beds and floors, and keep legs, arms and the floor out of them. Hems no longer catch inside a leg after a long run, and most of the black folds are gone. A character moved across the scene takes her cloth with her at once. Whether a skirt moves the way Koikatsu moves it or the way Renkatsu does is a choice per outfit.
"""

[[post]]
date = 2026-11-24
title = "Posing by hand works"
author = "Mihnea8848"
summary = "Turn any bone, mirror a pose, start from any frame of an animation and keep your poses in the project. It comes with the next version."
body = """
Posing by hand works in my builds now, and it comes with the next version.

Choose the Pose mode, select a character and switch on Forward kinematics in the palette. Every bone gets a handle. Click one and turn it with the rotate rings, or type its angles in Properties. As in CharaStudio, the parts can be switched on one at a time: hair, neck, breasts, body, each hand and the skirt.

The easiest way to start is from one of the game's animations. Bake animation keeps the frame on screen as a pose and takes the animation off, so you can fix the pose from there.

Mirror pose flips a whole pose from one side to the other, and Copy to other side copies one arm or leg onto its twin.

Poses you like can be saved into the project's Poses folder with Save pose. Load pose gives one to any character, and so does a double click on it or dropping it on the character in the Outliner.

The Animator panel under the viewport lists the character's skeleton with readable names and a search. Later on it will also hold the keys of animations you make yourself.

Inverse kinematics is next: moving a hand or a foot and letting the arm or the leg follow. I am porting the solver CharaStudio itself uses and checking it against poses captured in CharaStudio, so that a pose made in one looks the same in the other.
"""
pictures = [
    { file = "images/2026-11-24-pose-mode.jpg", caption = "Turning the left upper arm of a pose baked from Sit on desk", after = 2 },
    { file = "images/2026-11-24-mirror-pose.png", caption = "Mirror pose: the legs cross the other way and the head tilts to the other side", after = 4 },
    { file = "images/2026-11-24-pose-library.jpg", caption = "A saved pose in the project's Poses folder", after = 5 },
]

[[post]]
date = 2026-11-19
title = "Posing comes next"
author = "Mihnea8848"
summary = "I am working on FK and IK posing now. Baked characters come after that."
body = """
Characters in Renkatsu can already play the game's animations. With a Koikatsu folder there are 5728 of them, from standing and sitting to dancing, fighting and the H scenes, and Starter Content: Animations & Poses brings 3860 of them without the game. What is missing is the part of CharaStudio most people spend their time in: posing a character by hand. That is what I am working on now.

Posing will have its own mode, Pose, next to Character and Light. Selecting a character there shows handles on its bones. There are two ways to pose, and both work on the same skeleton.

FK, forward kinematics, means turning bones one by one. You pick the upper arm and rotate it, then the forearm, then the hand, and each bone carries the ones below it along. It is the precise way to pose, and the one to use for the spine, the head, the fingers and anything where the exact angle matters. The rotate gizmo from 0.1.8 does the turning, with the same snapping steps and the same Global and Local axes.

IK, inverse kinematics, works the other way round. You move a hand or a foot to where it should be, and the arm or the leg bends to reach it. This is how you put a hand on a table, a foot on a step or two hands together, without working out the angle of every joint. Feet that stay planted while the hips move are the other big use.

The two mix freely. A common way to work will be to start from one of the game's animations, pause it at a good moment and fix the pose from there: an IK hand moved onto a shoulder, the head turned a little with FK, the fingers closed. Mirror copies one side of the body to the other.

Poses you make are saved into the project's Poses folder, next to its animations, so the same pose can be given to another character or used again in another scene. Hands, the face and the gaze belong to posing too: hand shapes, expressions, and looking at the camera or at another character.

After posing come baked characters. Today a character is built from its card every time a project opens, which needs the game's files, or Starter Content, and every mod the card uses. A baked character keeps everything it is made of inside the project: meshes, textures, materials and bones. A project with baked characters opens the same on a computer without Koikatsu and without the mods.

I will post here again when posing is ready to try.
"""
pictures = [
    { file = "images/2026-11-19-animation-importer.jpg", caption = "The animation importer, with a preview of each animation", after = 1 },
]

[[post]]
date = 2026-11-18
title = "Starter Content is available"
author = "Mihnea8848"
summary = "You can use Renkatsu without Koikatsu now. Get Starter Content from the Packages window and you have characters, clothing, animations and maps to work with."
url = "https://github.com/Mihnea8848/renkatsu/releases"
body = """
Until now Renkatsu needed a Koikatsu install to build characters. That is no longer the case. Starter Content is Koikatsu's own vanilla content, put into packages that Renkatsu downloads and installs for you. Install them and you can make scenes without the game.

There are three packages, and each can be installed on its own.

Starter Content: Characters & Clothing holds the bodies, faces, hair, clothes and accessories that characters are built from, with the game's updates and add-ons, and the game's default characters as cards. With it, the default characters work, and so does any card that only uses the game's own content. It is 796 MB to download.

Starter Content: Animations & Poses holds CharaStudio's poses and animations: standing, sitting, talking, walking, dancing, fighting and the H scenes, 3860 in all. They show in the animation importer under the package's name, ready to copy into a project. It is 618 MB to download.

Starter Content: Maps, new in 0.2.1, holds the 42 maps of CharaStudio's list with their pictures: the school's classrooms, hallways and club rooms, the gym, the pool, the park, the church, the train and the rest. They show in the Maps library, at any time of day. It is 1006 MB to download.

To get them, open Packages at the bottom of the project selector's side menu and click Download next to each one. Renkatsu also offers Starter Content: Characters & Clothing on first start. A download that breaks off goes on from where it stopped, and every file is checked against its checksum before it is installed. Verify checks an installed package again, and Remove takes it off. Packages are installed once for your user, and every project can use them.

Starter Content is the vanilla game only. Cards that use mods still need those mods, and mods come with a Koikatsu install. If you have Koikatsu, you can point Renkatsu at your game folder as before, and your own cards and their mods are read from there. Both work together: a project can use the game folder and Starter Content at the same time.

You can also make packages of your own with the rk command line tool that comes with Renkatsu. The packages page in the documentation shows how.
"""
pictures = [
    { file = "images/2026-11-18-import-characters.jpg", caption = "Characters from Starter Content, ready to import into a project", after = 3 },
    { file = "images/2026-11-18-maps-library.jpg", caption = "CharaStudio's maps in the Maps library", after = 5 },
    { file = "images/2026-11-18-packages.jpg", caption = "The Packages window", after = 6 },
]
